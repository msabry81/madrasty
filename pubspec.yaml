name: madrasty
description: "منصة مدرستي التعليمية (Flutter Web + Firebase)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  cloud_functions: any
  firebase_storage: any

  # التنقل
  go_router: any

  # الويب: مشغّل YouTube المضمّن وفتح الروابط (package:web)
  web: any

  # توقيت القاهرة (يراعي التوقيت الصيفي)
  timezone: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # فعّل هذا القسم فقط بعد وضع ملفات الخطوط فعليًا في assets/fonts/
  # (إن أضفته قبل وجود الملفات سيفشل البناء)، وتأكد أن الأسماء مطابقة.
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Cairo-ExtraBold.ttf
  #         weight: 800
  #   - family: Tajawal
  #     fonts:
  #       - asset: assets/fonts/Tajawal-Regular.ttf
  #       - asset: assets/fonts/Tajawal-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Tajawal-Bold.ttf
  #         weight: 700